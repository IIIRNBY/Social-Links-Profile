<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
  <main>
    <div class="card">
      <div class="about-user">
        <img src="assets/images/avatar-jessica.jpeg" alt="user-avatar" class="user-avatar">
        <h2 class="user-nickname">
          Jessica Randall
        </h2>
        <h3 class="user-location">
          London, United Kingdom
        </h3>
        <p class="user-desc">
          "Front-end developer and avid reader."
        </p>
      </div>
      <div class="links-user">
        <ul class="list-links">
          <li class="point">
            <a href="https://github.com/IIIRNBY" class="point-link"> GitHub </a>
          </li>
          <li class="point">
            <a href="/" class="point-link"> Frontend Mentor </a>
          </li>
          <li class="point">
            <a href="/" class="point-link"> LinkedIn </a>
          </li>
          <li class="point">
            <a href="/" class="point-link"> Twitter </a>
          </li>
          <li class="point">
            <a href="/" class="point-link"> Instagram </a>
          </li>
        </ul>
      </div>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">@IIIRNBY</a>.
  </footer>
</body>
</html>
